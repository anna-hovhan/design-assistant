<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company Brain cover, short article</title>
<!--
  LinkedIn article cover, 1920x1080. Line-art style from /card-illustration on the navy pair,
  with the cover title set in HTML (rendered to PNG, so web fonts are fine).
  Subject: three stacked floors (personal, team, company); your tools feed the bottom floor;
  one note climbs, in aqua, only when you say yes. Copy rewritten 2026-11-09 for the short article.
  Tagline changed 2026-11-10 at the user's choice: the mechanism (your week links to the goals, you choose what reaches your team) instead of a promise.
-->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;
  background:linear-gradient(135deg,#0b1560 0%,#2f3dff 100%)}
.wrap{position:relative;width:1920px;height:1080px;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(10px)}
.copy{position:absolute;left:120px;top:0;height:1080px;width:860px;display:flex;flex-direction:column;justify-content:center}
.mono{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72)}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:108px;line-height:.92;letter-spacing:-.05em;margin-top:30px}
h1 span{display:block}
h1 .accent{display:inline-block}
h1 .accent{background:linear-gradient(90deg,#60e7f0,#99a5ff 55%,#ffb2cf);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.tag{font-size:34px;line-height:1.4;font-weight:500;color:rgba(255,255,255,.9);margin-top:40px;max-width:760px;letter-spacing:-.01em}
.foot{position:absolute;left:120px;bottom:72px;display:flex;gap:16px}
.pill{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.16em;text-transform:uppercase;
  padding:12px 22px;border-radius:100px;border:1.5px solid rgba(255,255,255,.45);color:rgba(255,255,255,.86)}
svg.art{position:absolute;left:990px;top:62px}
</style>
</head>
<body>
<div class="wrap">
  <div class="glow" style="width:900px;height:900px;right:-240px;top:-300px;background:radial-gradient(circle,rgba(96,231,240,.20),rgba(96,231,240,0) 65%)"></div>
  <div class="glow" style="width:900px;height:900px;left:-320px;bottom:-460px;background:radial-gradient(circle,rgba(255,178,207,.16),rgba(255,178,207,0) 65%)"></div>

  <div class="copy">
    <div class="mono">A shared memory for people and AI</div>
    <h1><span>Company</span><span class="accent">Brain</span></h1>
    <p class="tag">Your week links to team and company goals, and you choose what reaches your team.</p>
  </div>
  <div class="foot">
    <span class="pill">Open source</span>
    <span class="pill">Claude + Obsidian</span>
  </div>

  <svg class="art" width="900" height="936" viewBox="0 0 1000 1040" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" font-family="JetBrains Mono, monospace">
    <defs>
      <marker id="up" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
        <path d="M2 2 L10 6 L2 10" stroke="#60e7f0" stroke-width="2" fill="none"/>
      </marker>
    </defs>

    <!-- sources: dashed feeds into the personal floor -->
    <g stroke-opacity=".6" stroke-dasharray="3 10" stroke-width="2.5">
      <path d="M918 548 C 900 640, 880 700, 830 738"/>
      <path d="M918 632 C 900 690, 880 720, 832 742"/>
      <path d="M918 716 C 895 730, 870 742, 834 746"/>
      <path d="M918 800 C 895 780, 870 760, 834 750"/>
      <path d="M918 884 C 900 830, 880 790, 832 754"/>
      <path d="M918 968 C 905 890, 880 820, 830 758"/>
    </g>
    <g stroke-width="2.5">
      <!-- chat -->
      <path d="M934 528 h44 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-26 l-12 10 v-10 h-6 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8z"/>
      <!-- calendar -->
      <rect x="932" y="612" width="50" height="44" rx="8"/><path d="M932 626 h50 M946 606 v12 M968 606 v12"/>
      <!-- email -->
      <rect x="932" y="698" width="50" height="36" rx="7"/><path d="M934 702 l23 18 l23 -18"/>
      <!-- ticket -->
      <rect x="934" y="778" width="44" height="44" rx="9"/><path d="M944 800 l8 8 l16 -16"/>
      <!-- document -->
      <path d="M938 862 h26 l14 14 v32 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 v-40 a6 6 0 0 1 6 -6z M948 886 h22 M948 898 h16"/>
      <!-- meeting notes: waveform -->
      <path d="M934 968 v0 M944 958 v20 M954 948 v40 M964 954 v28 M974 962 v12 M984 966 v4"/>
    </g>

    <!-- floors: isometric planes. flat 0..100 square mapped to a diamond with L at (200,cy) -->
    <!-- personal -->
    <g transform="matrix(3.2,-1.6,3.2,1.6,200,760)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="#fff" fill-opacity=".08" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <g stroke-width="2.5" vector-effect="non-scaling-stroke">
        <rect x="14" y="16" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="16" y="60" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="56" y="20" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
      </g>
      <g stroke-opacity=".6" stroke-dasharray="3 10" stroke-width="2.5">
        <path d="M36 24 H56 M25 32 V60 M38 66 H51 M67 36 V54" vector-effect="non-scaling-stroke"/>
      </g>
      <rect x="51" y="54" width="22" height="16" rx="3.5" stroke="#60e7f0" stroke-width="3" fill="#60e7f0" fill-opacity=".18" vector-effect="non-scaling-stroke"/>
    </g>
    <!-- team -->
    <g transform="matrix(3.2,-1.6,3.2,1.6,200,520)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="#fff" fill-opacity=".08" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <g stroke-width="2.5">
        <rect x="12" y="14" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="58" y="14" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="14" y="62" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
      </g>
      <g stroke-opacity=".6" stroke-dasharray="3 10" stroke-width="2.5">
        <path d="M34 22 H58 M23 30 V62 M69 30 V54 M36 66 H51" vector-effect="non-scaling-stroke"/>
      </g>
      <rect x="51" y="54" width="22" height="16" rx="3.5" stroke="#60e7f0" stroke-width="3" fill="#60e7f0" fill-opacity=".18" vector-effect="non-scaling-stroke"/>
    </g>
    <!-- company -->
    <g transform="matrix(3.2,-1.6,3.2,1.6,200,280)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="#fff" fill-opacity=".08" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <g stroke-width="2.5">
        <rect x="10" y="12" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="40" y="10" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="70" y="14" width="20" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
        <rect x="12" y="58" width="22" height="16" rx="3.5" fill="#fff" fill-opacity=".1" vector-effect="non-scaling-stroke"/>
      </g>
      <g stroke-opacity=".6" stroke-dasharray="3 10" stroke-width="2.5">
        <path d="M32 20 H40 M62 18 H70 M21 28 V58 M51 26 V54 M80 30 V62 H73 M34 66 H51" vector-effect="non-scaling-stroke"/>
      </g>
      <rect x="51" y="54" width="22" height="16" rx="3.5" stroke="#60e7f0" stroke-width="3" fill="#60e7f0" fill-opacity=".18" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- the climb: the same note moves up a floor, only with your yes -->
    <g stroke="#60e7f0" stroke-width="3">
      <path d="M598 736 V 552" marker-end="url(#up)"/>
      <path d="M598 496 V 312" marker-end="url(#up)"/>
    </g>
    <g stroke="#60e7f0" stroke-width="3" fill="#0f1d78">
      <circle cx="598" cy="630" r="22"/><path d="M587 630 l7 7 l13 -14"/>
      <circle cx="598" cy="390" r="22"/><path d="M587 390 l7 7 l13 -14"/>
    </g>

    <!-- floor labels -->
    <g stroke="none" fill="#fff" fill-opacity=".8" font-size="19" letter-spacing="3.4" text-anchor="end">
      <text x="180" y="286">COMPANY</text>
      <text x="180" y="526">TEAM</text>
      <text x="180" y="766">YOUR DESK</text>
    </g>
  </svg>
</div>
</body>
</html>
