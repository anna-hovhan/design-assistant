name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      # Generators, the brand rules (docs/brand.md) against the templates and the design system, and no pink anywhere.
      - run: npm test
