<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--page); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--page); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .primary { fill: var(--primary); }
  .aqua { fill: var(--aqua); }
  .peri { fill: var(--periwinkle); }
  .cut { fill: var(--page); }
  .butter { fill: var(--butter); }
  .blk { rx: var(--radius-card); ry: var(--radius-card); }
  .text { position: absolute; left: 32px; bottom: 28px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: .95; letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }
  .tag { margin: 10px 0 0; max-width: 440px; font-family: var(--font-sans); font-size: 14px; line-height: 1.4; color: var(--text-muted); }
</style>
</head><body>
<div class="cover">
  <!--
    blocks: primary 480x104, aqua 192x104, periwinkle 128x104, corners radius-card (28px); together 34% of the cover.
    arrangement: a strip of unequal bands across the top (the top-band skeleton: "AH Visuals" is 536px wide at 64px in Syne 800, past the 440px zone).
    pattern: pills cut from the primary slab in the page colour, one of them butter, because this brand's chips, tags and slide pills are pills on large-radius cards.
    scales: space-gap (16px) between pills and between rows; pill height 16 with rx 8 (half the short side); radius-card on the blocks.
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="primary blk" x="32" y="24" width="480" height="104"/>
    <rect class="aqua blk" x="528" y="24" width="192" height="104"/>
    <rect class="peri blk" x="736" y="24" width="128" height="104"/>
    <rect class="cut" x="64" y="40" width="112" height="16" rx="8"/>
    <rect class="cut" x="192" y="40" width="64" height="16" rx="8"/>
    <rect class="cut" x="272" y="40" width="96" height="16" rx="8"/>
    <rect class="cut" x="64" y="68" width="64" height="16" rx="8"/>
    <rect class="butter" x="144" y="68" width="128" height="16" rx="8"/>
    <rect class="cut" x="288" y="68" width="48" height="16" rx="8"/>
    <rect class="cut" x="64" y="96" width="96" height="16" rx="8"/>
    <rect class="cut" x="176" y="96" width="80" height="16" rx="8"/>
  </svg>
  <div class="text">
    <p class="name">AH Visuals v2</p>
    <p class="tag">One-pagers, explainers, diagrams, slides and covers.</p>
  </div>
</div>
</body></html>
