<!-- @dsCard group="Pages" height=440 subtitle="Schematic of the parts, not a real page" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:16px;background:var(--page);color:var(--text);font:400 14px/1.45 var(--font-sans)}figure{margin:0}figcaption{margin-top:8px;color:var(--text-muted);font-size:13px}img{display:block;max-width:100%;height:auto}.sheet{width:300px;height:400px;margin:0 auto;padding:24px;box-sizing:border-box;background:linear-gradient(180deg,var(--page),var(--page-wash));border-radius:6px;box-shadow:var(--card-shadow)}
.tag{font:500 9px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.title{font:800 26px/1.05 var(--font-display);letter-spacing:-.02em;margin-top:8px}
.lead{font-size:11px;color:var(--text-muted);margin:8px 0 16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:var(--stroke-card) solid var(--card-border);border-radius:16px;box-shadow:var(--card-shadow);padding:12px;display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--text-muted)}
.card b{font:800 12px var(--font-display);color:var(--text)}
.chips{display:flex;gap:6px;margin-top:14px}.chips span{font:500 9px var(--font-mono);background:#fff;border:var(--stroke-outline) solid var(--periwinkle);border-radius:var(--radius-pill);padding:4px 9px}</style>
</head><body>
<div class="sheet">
<div class="tag">Case study</div>
<div class="title">Title of the brief</div>
<p class="lead">One sentence on what it is and who it is for.</p>
<div class="row"><div class="card"><b>Problem</b><span>Two lines of body text.</span></div><div class="card"><b>Result</b><span>Two lines of body text.</span></div></div>
<div class="chips"><span>tool</span><span>topic</span></div>
</div>
</body></html>
