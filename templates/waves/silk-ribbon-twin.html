<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk ribbon waves (twin)</title>
<style>
  :root{
    --bg:#f4f6fb; --ink:#23264a; --muted:#6b6f93;
    --c1:#a8b2ff; --c2:#8d6fd6; --c3:#ffb3cf; --c4:#7fe8f0;
    --glow1:rgba(168,178,255,.45); --glow2:rgba(255,179,207,.5);
    --line:#ffffff; --line-op:.85;
  }
  :root[data-mode="reference"]{
    --bg:#2a3170; --ink:#fff; --muted:#e6d9ee;
    --glow1:rgba(44,52,120,1); --glow2:rgba(247,205,222,.95);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
  .stage{position:relative;min-height:100vh;overflow:hidden;isolation:isolate}
  .bg{position:absolute;inset:0;z-index:-2;transition:background .6s}
  :root:not([data-mode="reference"]) .bg{
    background:
      radial-gradient(ellipse 80% 70% at 10% 20%,var(--glow1),transparent 70%),
      radial-gradient(ellipse 90% 70% at 95% 95%,var(--glow2),transparent 70%),
      radial-gradient(ellipse 60% 50% at 60% 55%,rgba(255,236,170,.35),transparent 70%),
      var(--bg);
  }
  :root[data-mode="reference"] .bg{
    background:linear-gradient(155deg,#1f2a6b 0%,#5a5489 30%,#8a7a9f 55%,#cdb0c9 80%,#f7d3de 100%);
  }
  svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;
      opacity:0;animation:in 1.1s ease-out .1s forwards}
  @keyframes in{to{opacity:1}}
  header,main{position:relative;max-width:1080px;margin:0 auto;padding:0 24px}
  header{display:flex;justify-content:space-between;padding-top:28px;font-weight:600}
  main{padding-top:18vh;padding-bottom:30vh}
  h1{font-size:clamp(40px,7vw,84px);line-height:1;margin:0 0 20px;font-weight:600;letter-spacing:-.02em;max-width:11ch}
  h1 em{font-family:Georgia,serif;font-weight:400;color:#7b5fd0}
  :root[data-mode="reference"] h1 em{color:#ffd9e6}
  p{max-width:46ch;color:var(--muted);font-size:18px;line-height:1.55}
  .ctl{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
       background:rgba(255,255,255,.8);backdrop-filter:blur(14px);padding:10px;border-radius:16px;
       box-shadow:0 10px 30px rgba(40,40,90,.18);z-index:5;font-size:13px;color:#23264a}
  .ctl button{border:1px solid #c9ccee;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
  .ctl button[aria-pressed="true"]{background:#23264a;color:#fff;border-color:#23264a}
  .sec{height:70vh}
  @media (prefers-reduced-motion:reduce){svg{animation-duration:1ms}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <svg id="waves" viewBox="0 0 1000 2400" preserveAspectRatio="xMidYMin slice" aria-hidden="true"></svg>
  <header><span>Anna Hovhannisyan</span><span>Work · About · Contact</span></header>
  <main>
    <h1>AI strategy that <em>flows</em></h1>
    <p>A single silk ribbon of fine lines, tight at the fold and fanning open into air. Scroll to see how it carries through the page.</p>
    <div class="sec"></div><div class="sec"></div>
  </main>
</div>
<script>
// Each strand is x(y) = edge(y) + spread(y) * f(i/N). Strands are packed tightly at the edge
// (f is a power curve) and fan out where spread(y) grows, which gives the dense bright fold
// and the airy open sweep seen in the reference.
const W=1000,H=2400,NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("waves");
const lerp=(a,b,t)=>a+(b-a)*t;
function smooth(t){return t*t*(3-2*t)}
// Catmull-ish smooth curve through control points {y,x}
function curve(pts){
  return y=>{
    let i=0; while(i<pts.length-2&&y>pts[i+1][0]) i++;
    const [y0,x0]=pts[i],[y1,x1]=pts[i+1];
    return lerp(x0,x1,smooth(Math.min(1,Math.max(0,(y-y0)/(y1-y0)))));
  };
}
let ref=false;function ribbon(opts){
  const {edge,spread,n,power,color,w}=opts;
  const g=document.createElementNS(NS,"g");
  g.setAttribute("fill","none");
  for(let i=0;i<n;i++){
    const f=Math.pow(i/(n-1),power);
    let d="";
    for(let y=-40;y<=H+40;y+=16){
      // gentle per-strand drift so lines cross softly, like silk folding
      const twist=Math.sin(y/330+i*0.035)*16*f;
      const x=edge(y)+spread(y)*f+twist;
      d+=(d?" L":"M")+x.toFixed(1)+" "+y;
    }
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",d);
    p.setAttribute("stroke",color(i/(n-1)));
    p.setAttribute("stroke-width",w);
    p.setAttribute("stroke-opacity",(ref?(0.35+0.6*(1-f*0.7)):(0.55+0.4*(1-f*0.5))).toFixed(2));
    p.setAttribute("stroke-linejoin","round");
    g.appendChild(p);
  }
  return g;
}
const whiteish=t=>"rgba(255,255,255,.95)";
const tinted=t=>{ // white at the fold fading to periwinkle/blush in the open fan
  const a=[150,140,235],b=[170,150,240],c=[245,150,195];
  const m=t<.5?[a,b,t*2]:[b,c,(t-.5)*2];
  const k=m[2];return `rgb(${[0,1,2].map(j=>Math.round(lerp(m[0][j],m[1][j],k))).join(",")})`;
};
function build(kind){
  svg.innerHTML="";
  ref=document.documentElement.dataset.mode==="reference";
  const col=ref?whiteish:tinted;
  // main ribbon: enters top right, sweeps left through the page, folds back right
  // Smooth periodic fold: sums of sines have no joints, so no corners or flat runs.
  const T=Math.PI*2/1300;
  const edge=y=>715+187*Math.sin(y*T)+49*Math.sin(2*y*T+1.2);
  const spread=y=>360+167*Math.sin(y*T+2.4)+42*Math.sin(2*y*T+0.4);
  svg.appendChild(ribbon({edge,spread,n:150,power:1.35,color:col,w:ref?0.9:0.8}));
  if(kind==="twin"){
    const e2=y=>-60+90*Math.sin(y*T*1.5+0.8)+40*Math.sin(y*T*0.5);
    const s2=y=>110+60*Math.sin(y*T*1.5+2.0);
    svg.appendChild(ribbon({edge:e2,spread:s2,n:90,power:1.6,color:col,w:.9}));
  }
}
function setV(v){
  document.documentElement.dataset.mode=v==="reference"?"reference":"light";
  document.querySelectorAll(".ctl button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  build(v);
}
setV("twin");
</script>
</body>
</html>
